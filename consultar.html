<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMIT - Consultas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        .header {
            background-color: #003366;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .frame-container {
            width: 100%;
            height: calc(100vh - 45px);
            border: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">SIMIT - Federación Colombiana de Municipios</div>
    <div class="frame-container">
        <iframe 
            src="https://www.fcm.org.co/simit/#/home-public"
            title="SIMIT Consultas"
            allow="geolocation; microphone; camera; payment"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </div>
</body>
</html>
